<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Превью на iPhone 18 Pro Max</title>
    <!--
      Страница только для разработки: показывает приложение внутри макета iPhone 18 Pro Max
      (экран 6,9″, 440×956 точек) с шапкой Telegram. В итоговую сборку не попадает.
      У 18 Pro Max Dynamic Island заметно уже, чем у прошлых моделей (по утечкам ~35%).
      Когда в приложении идёт отдых между подходами, остров раскрывается и показывает таймер —
      как Live Activity в настоящем iOS.
      Открыть: http://localhost:5173/preview.html
    -->
    <style>
      :root {
        --screen-w: 440px;
        --screen-h: 956px;
        --screen-r: 62px;
        --bezel: 12px;
        --edge: 4px;
        --app-bg: #1c1d1f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        background: radial-gradient(ellipse at 50% 30%, #3a3c40 0%, #202124 55%, #151618 100%);
        font-family: -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }

      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Телефон целиком, масштабируется под окно */
      .phone {
        position: relative;
        flex: none;
        width: calc(var(--screen-w) + 2 * (var(--bezel) + var(--edge)));
        height: calc(var(--screen-h) + 2 * (var(--bezel) + var(--edge)));
        transform-origin: center center;
      }

      /* Титановый корпус */
      .frame {
        position: absolute;
        inset: 0;
        border-radius: calc(var(--screen-r) + var(--bezel) + var(--edge));
        padding: var(--edge);
        background: linear-gradient(135deg, #8a8580 0%, #5b5752 22%, #a39e98 48%, #5e5a55 74%, #8d8883 100%);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.6),
          0 40px 80px rgba(0, 0, 0, 0.55),
          0 12px 30px rgba(0, 0, 0, 0.35);
      }

      /* Чёрная рамка вокруг экрана */
      .bezel {
        width: 100%;
        height: 100%;
        border-radius: calc(var(--screen-r) + var(--bezel));
        padding: var(--bezel);
        background: #050505;
        box-shadow: inset 0 0 0 1.5px #1d1d1f;
      }

      .screen {
        position: relative;
        width: var(--screen-w);
        height: var(--screen-h);
        border-radius: var(--screen-r);
        overflow: hidden;
        background: var(--app-bg);
        display: flex;
        flex-direction: column;
        isolation: isolate;
      }

      /* Боковые кнопки */
      .btn {
        position: absolute;
        width: 5px;
        border-radius: 2px;
        background: linear-gradient(90deg, #6d6964, #a39e98 50%, #6d6964);
      }
      .btn.left {
        left: -3px;
      }
      .btn.right {
        right: -3px;
      }
      .action {
        top: 196px;
        height: 36px;
      }
      .vol-up {
        top: 268px;
        height: 68px;
      }
      .vol-down {
        top: 352px;
        height: 68px;
      }
      .power {
        top: 300px;
        height: 104px;
      }
      .camera {
        top: 560px;
        height: 64px;
        border-radius: 3px;
      }

      /* Строка состояния */
      .status {
        position: relative;
        flex: none;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 34px 0 52px;
        color: #fff;
        font-weight: 600;
        font-size: 17px;
        letter-spacing: -0.01em;
      }

      .status-icons {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      /* Dynamic Island iPhone 18 Pro Max: уже прошлых (≈82 точки против 126) */
      .island {
        position: absolute;
        top: 11px;
        left: 50%;
        width: 82px;
        height: 34px;
        transform: translateX(-50%);
        border-radius: 20px;
        background: #000;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px 0 10px;
        overflow: hidden;
        /* раскрытие острова — по iOS-кривой, как у системных Live Activity */
        transition:
          width 420ms cubic-bezier(0.32, 0.72, 0, 1),
          height 420ms cubic-bezier(0.32, 0.72, 0, 1);
      }

      .island.live {
        width: 208px;
        height: 37px;
      }

      /* объектив фронтальной камеры — справа в острове */
      .island-lens {
        position: absolute;
        right: 14px;
        top: 50%;
        width: 11px;
        height: 11px;
        margin-top: -5.5px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 40%, #2b3a55 0%, #0b0f18 60%);
        transition: opacity 200ms ease;
      }

      .island.live .island-lens {
        opacity: 0;
      }

      /* Содержимое Live Activity: слева кольцо отдыха, справа оставшееся время */
      .island-leading,
      .island-trailing {
        display: flex;
        align-items: center;
        gap: 6px;
        opacity: 0;
        transform: scale(0.8);
        transition:
          opacity 180ms ease,
          transform 300ms cubic-bezier(0.23, 1, 0.32, 1);
        white-space: nowrap;
      }

      .island.live .island-leading,
      .island.live .island-trailing {
        opacity: 1;
        transform: none;
        transition-delay: 160ms;
      }

      .island-ring {
        width: 20px;
        height: 20px;
        transform: rotate(-90deg);
      }

      .island-ring circle {
        fill: none;
        stroke-width: 3;
      }

      .island-label {
        color: #ff8a47;
        font-size: 13px;
        font-weight: 600;
      }

      .island-time {
        color: #ff8a47;
        font-size: 15px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      @media (prefers-reduced-motion: reduce) {
        .island,
        .island-leading,
        .island-trailing {
          transition-duration: 1ms;
        }
      }

      /* Шапка Telegram Mini App */
      .tg-header {
        flex: none;
        height: 44px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 0 14px;
        color: #fff;
      }

      .tg-close {
        justify-self: start;
        font: inherit;
        font-size: 17px;
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        border: 0;
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
      }

      .tg-title {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1.15;
      }

      .tg-title b {
        font-size: 16px;
        font-weight: 600;
      }

      .tg-title span {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.55);
      }

      .tg-more {
        justify-self: end;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Само приложение */
      iframe {
        flex: 1;
        width: 100%;
        border: 0;
        display: block;
        background: var(--app-bg);
      }

      /* Полоска «домой» */
      .home {
        position: absolute;
        left: 50%;
        bottom: 8px;
        width: 150px;
        height: 5px;
        margin-left: -75px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.9);
        z-index: 3;
        pointer-events: none;
      }

      /* Подпись и кнопки сбоку */
      .side {
        position: fixed;
        left: 20px;
        bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        color: rgba(255, 255, 255, 0.55);
        font-size: 13px;
      }

      .side b {
        color: rgba(255, 255, 255, 0.85);
        font-weight: 600;
      }

      .side-actions {
        display: flex;
        gap: 8px;
      }

      .side a,
      .side button {
        font: inherit;
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        border: 0;
        border-radius: 10px;
        padding: 8px 12px;
        text-decoration: none;
        cursor: pointer;
      }

      .side a:hover,
      .side button:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      @media (max-width: 700px) {
        .side {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="phone" id="phone">
        <span class="btn left action"></span>
        <span class="btn left vol-up"></span>
        <span class="btn left vol-down"></span>
        <span class="btn right power"></span>
        <span class="btn right camera"></span>

        <div class="frame">
          <div class="bezel">
            <div class="screen">
              <div class="island" id="island">
                <span class="island-leading">
                  <svg class="island-ring" viewBox="0 0 20 20" aria-hidden="true">
                    <circle cx="10" cy="10" r="8" stroke="rgba(255,138,71,.25)" />
                    <circle id="island-ring-fill" cx="10" cy="10" r="8" stroke="#ff8a47" stroke-linecap="round" stroke-dasharray="50.27" stroke-dashoffset="0" />
                  </svg>
                  <span class="island-label">Отдых</span>
                </span>
                <span class="island-trailing">
                  <span class="island-time" id="island-time">0:00</span>
                </span>
                <span class="island-lens"></span>
              </div>

              <div class="status">
                <span id="clock">9:41</span>
                <span class="status-icons" aria-hidden="true">
                  <!-- связь -->
                  <svg width="19" height="12" viewBox="0 0 19 12" fill="#fff">
                    <rect x="0" y="8" width="3.2" height="4" rx="1" />
                    <rect x="5" y="5.5" width="3.2" height="6.5" rx="1" />
                    <rect x="10" y="3" width="3.2" height="9" rx="1" />
                    <rect x="15" y="0" width="3.2" height="12" rx="1" />
                  </svg>
                  <!-- Wi-Fi -->
                  <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff">
                    <path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.2-1.2A10.6 10.6 0 0 0 8.5.6 10.6 10.6 0 0 0 1 3.6l1.2 1.2a9 9 0 0 1 6.3-2.5Z" />
                    <path d="M8.5 5.6c1.5 0 2.9.6 4 1.6l1.2-1.2a7.3 7.3 0 0 0-10.4 0l1.2 1.2c1.1-1 2.5-1.6 4-1.6Z" />
                    <path d="M8.5 8.9c.6 0 1.2.2 1.6.6L8.5 11.2 6.9 9.5c.4-.4 1-.6 1.6-.6Z" />
                  </svg>
                  <!-- батарея -->
                  <svg width="28" height="13" viewBox="0 0 28 13">
                    <rect x="0.5" y="0.5" width="24" height="12" rx="3.8" fill="none" stroke="rgba(255,255,255,.4)" />
                    <rect x="2" y="2" width="17" height="9" rx="2.4" fill="#fff" />
                    <path d="M26 4.3v4.4c.9-.3 1.5-1.2 1.5-2.2s-.6-1.9-1.5-2.2Z" fill="rgba(255,255,255,.45)" />
                  </svg>
                </span>
              </div>

              <div class="tg-header">
                <button class="tg-close" type="button" onclick="reloadApp()" title="В Telegram эта кнопка закрывает приложение; здесь — перезапускает">
                  Закрыть
                </button>
                <div class="tg-title">
                  <b>Дневник тренировок</b>
                  <span>мини-приложение</span>
                </div>
                <div class="tg-more" aria-hidden="true">
                  <svg width="16" height="4" viewBox="0 0 16 4" fill="#fff">
                    <circle cx="2" cy="2" r="1.8" />
                    <circle cx="8" cy="2" r="1.8" />
                    <circle cx="14" cy="2" r="1.8" />
                  </svg>
                </div>
              </div>

              <iframe id="app" src="./" title="Дневник тренировок"></iframe>
              <div class="home"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="side">
      <div><b>iPhone 18 Pro Max</b>, экран 6,9″ (440×956)</div>
      <div class="side-actions">
        <button type="button" onclick="reloadApp()">Перезапустить</button>
        <a href="./" target="_blank">Без рамки</a>
      </div>
    </div>

    <script>
      // Подгоняем телефон под размер окна (не больше натуральной величины)
      const phone = document.getElementById('phone');
      function fit() {
        const w = phone.offsetWidth;
        const h = phone.offsetHeight;
        const scale = Math.min(1, (window.innerWidth - 40) / w, (window.innerHeight - 40) / h);
        phone.style.transform = `scale(${scale})`;
      }
      window.addEventListener('resize', fit);
      fit();

      // Живые часы в строке состояния
      const clock = document.getElementById('clock');
      function tick() {
        const d = new Date();
        clock.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
      }
      tick();
      setInterval(tick, 10000);

      // Как настоящий Telegram на iPhone: сообщаем приложению высоту зоны полоски «домой»
      const app = document.getElementById('app');
      app.addEventListener('load', () => {
        try {
          app.contentDocument.documentElement.style.setProperty('--tg-safe-area-inset-bottom', '34px');
        } catch (e) {
          /* другой адрес — пропускаем */
        }
      });

      function reloadApp() {
        app.contentWindow.location.reload();
      }

      // Live Activity: приложение хранит момент окончания отдыха в localStorage
      // (тот же адрес — то же хранилище), остров читает его и показывает обратный отсчёт.
      const island = document.getElementById('island');
      const islandTime = document.getElementById('island-time');
      const ringFill = document.getElementById('island-ring-fill');
      const RING = 2 * Math.PI * 8;
      function liveActivity() {
        let rest = null;
        try {
          rest = JSON.parse(localStorage.getItem('gym-diary:rest') || 'null');
        } catch (e) {
          rest = null;
        }
        const left = rest ? rest.endsAt - Date.now() : 0;
        const on = left > 0;
        island.classList.toggle('live', on);
        if (on) {
          const sec = Math.ceil(left / 1000);
          islandTime.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
          ringFill.setAttribute('stroke-dashoffset', String(RING * (1 - left / (rest.total * 1000))));
        }
      }
      liveActivity();
      setInterval(liveActivity, 250);
    </script>
  </body>
</html>
